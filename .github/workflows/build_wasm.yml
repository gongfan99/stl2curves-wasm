name: Build WASM (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  EM_VERSION: 6.0.13
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [threaded, single_thread]
    steps:
      - uses: actions/checkout@v7
      - name: Cache EMSDK
        id: cache-emsdk
        uses: actions/cache@v6
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EM_VERSION }}
      - name: Clone EMSDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: git clone https://github.com/emscripten-core/emsdk.git emsdk
      - name: Install and activate EMSDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          emsdk/emsdk install "$EM_VERSION"
          emsdk/emsdk activate "$EM_VERSION"
      - name: Export preinstalled vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
      - name: Cache vcpkg binaries
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: .cache/vcpkg-binaries
          key: vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-em${{ env.EM_VERSION }}-${{ hashFiles('vcpkg*.json', 'vcpkg-triplets/**', 'vcpkg-overlays/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-em${{ env.EM_VERSION }}-${{ hashFiles('vcpkg*.json', 'vcpkg-triplets/**', 'vcpkg-overlays/**') }}-
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-em${{ env.EM_VERSION }}-
      - name: Record restored binary archives
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p .cache/vcpkg-binaries ".cache/vcpkg-diagnostics/$VARIANT"
          find .cache/vcpkg-binaries -type f -name '*.zip' -printf '%P\n' | sort > ".cache/vcpkg-diagnostics/$VARIANT/restored-archives.txt"
      - name: Build and package variant
        env:
          VARIANT: ${{ matrix.variant }}
          PACKAGE_VARIANT_ONLY: "ON"
        run: |
          set -o pipefail
          source emsdk/emsdk_env.sh
          mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg-binaries"
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/.cache/vcpkg-binaries,readwrite"
          sh scripts/build_wasm.sh "$VARIANT" 2>&1 | tee ".cache/vcpkg-diagnostics/$VARIANT/build.log"
      - name: Collect vcpkg ABI diagnostics
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
          VCPKG_CACHE_HIT: ${{ steps.cache-vcpkg.outputs.cache-hit }}
        run: |
          if [ -f emsdk/emsdk_env.sh ]; then source emsdk/emsdk_env.sh || true; fi
          sh scripts/collect_vcpkg_diagnostics.sh "$VARIANT"
      - name: Upload vcpkg ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-diagnostics-${{ matrix.variant }}-${{ github.run_attempt }}
          path: .cache/vcpkg-diagnostics/${{ matrix.variant }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: stl2curves-part-${{ matrix.variant }}
          path: dist/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 1
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stl2curves-part-threaded
          path: .cache/wasm-parts/threaded
      - uses: actions/download-artifact@v8
        with:
          name: stl2curves-part-single_thread
          path: .cache/wasm-parts/single_thread
      - name: Assemble and validate deployment layout
        run: cmake -DROOT="$GITHUB_WORKSPACE" -DINPUT_DIR="$GITHUB_WORKSPACE/.cache/wasm-parts" -P scripts/assemble_wasm.cmake
      - uses: actions/upload-artifact@v7
        with:
          name: stl2curves-wasm
          path: dist/
          if-no-files-found: error
          retention-days: 7
  # Runtime tests are deliberately deferred until artifacts are available and
  # explicitly requested. This workflow only compiles and packages.
